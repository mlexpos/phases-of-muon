name = "muon"
version = "0.1.0"
defaultTargets = ["Muon"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "Muon"

# Foundations packages (final integration, 2026-10-25): F.7.P1 measure existence uses SpectralFoundations.
[[require]]
name = "spectral_foundations"
git = "https://github.com/mlexpos/alea-foundations"
rev = "cf94c5bcfc7b88081ef02637f33fbccc4f7be324"
subDir = "spectral-foundations"

[[require]]
name = "gaussian_foundations"
git = "https://github.com/mlexpos/alea-foundations"
rev = "cf94c5bcfc7b88081ef02637f33fbccc4f7be324"
subDir = "gaussian-foundations"

[[require]]
name = "probability_foundations"
git = "https://github.com/mlexpos/alea-foundations"
rev = "cf94c5bcfc7b88081ef02637f33fbccc4f7be324"
subDir = "probability-foundations"

[[require]]
name = "matrix_concentration"
git = "https://github.com/mlexpos/alea-foundations"
rev = "cf94c5bcfc7b88081ef02637f33fbccc4f7be324"
subDir = "matrix-concentration"
